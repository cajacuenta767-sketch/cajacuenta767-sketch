<svg xmlns="http://www.w3.org/2000/svg" width="900" height="358" viewBox="0 0 900 358" role="img" aria-label="Experiencia profesional"><title>Experiencia profesional</title><style>
  .tw { animation: tw 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes tw { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
  .steam path { animation: steam 2.2s ease-in-out infinite; opacity: 0; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-8px); } }
  .zz { animation: zz 2.4s ease-in-out infinite; opacity: 0; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0,4px); } 35% { opacity: 1; } 100% { opacity: 0; transform: translate(6px,-10px); } }
</style><defs><clipPath id="hd"><ellipse cx="0" cy="0" rx="40" ry="34"/></clipPath><clipPath id="bd"><path d="M-30,18 C-36,40 -32,66 0,66 C32,66 36,40 30,18 Z"/></clipPath></defs><rect x="1.5" y="1.5" width="897" height="355" rx="14" fill="#161b22" stroke="#30363d" stroke-width="3"/><line x1="40" y1="40" x2="40" y2="264" stroke="#30363d" stroke-width="3"/><circle cx="40" cy="40" r="7" fill="#3fb950" stroke="#161b22" stroke-width="3"/><text x="64" y="46" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Founder &amp; Lead Software Architect</text><text x="64" y="67" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#58a6ff">Sky tech<tspan fill="#8b949e"> · Ene 2024 – Presente</tspan></text><text x="64" y="90" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e6edf3">Dirijo el ciclo completo de desarrollo: ERPs (SCIGE e inmobiliario), MVPs como</text><text x="64" y="110" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e6edf3">Avendia y Avend Escala, pipelines de datos, bots de Telegram y monitoreo con Zabbix.</text><circle cx="40" cy="146" r="7" fill="#3fb950" stroke="#161b22" stroke-width="3"/><text x="64" y="152" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Full-Stack Developer</text><text x="64" y="173" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#58a6ff">Poiesis Consulting S.R.L.<tspan fill="#8b949e"> · Ene 2023 – Dic 2023</tspan></text><text x="64" y="196" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e6edf3">Arquitecturas escalables con React.js y Node.js, interfaces UX/UI responsivas,</text><text x="64" y="216" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e6edf3">sistemas POS y paneles analíticos en tiempo real sobre bases SQL y NoSQL.</text><circle cx="40" cy="252" r="7" fill="#3fb950" stroke="#161b22" stroke-width="3"/><text x="64" y="258" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Pasante de Desarrollo de Software</text><text x="64" y="279" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#58a6ff">BTSOFT<tspan fill="#8b949e"> · Ene 2021 – Dic 2022</tspan></text><text x="64" y="302" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e6edf3">Mantenimiento y optimización de sistemas internos, nuevas funcionalidades web con</text><text x="64" y="322" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e6edf3">metodologías ágiles, pruebas de validación y documentación.</text><g transform="translate(800 238) scale(0.6)"><path d="M-30,18 C-36,40 -32,66 0,66 C32,66 36,40 30,18 Z" fill="#ffffff" stroke="#111318" stroke-width="3.5" stroke-linejoin="round"/><g clip-path="url(#bd)"><path d="M18,40 C28,36 36,46 30,56 C24,62 14,56 16,48 Z" fill="#343a43"/><circle cx="-22" cy="52" r="4" fill="#9aa3ad"/></g><path d="M-31,30 C-14,42 14,42 31,30" fill="none" stroke="#111318" stroke-width="12" stroke-linecap="round"/><path d="M-31,30 C-14,42 14,42 31,30" fill="none" stroke="#7d8590" stroke-width="7" stroke-linecap="round"/><path d="M-31,30 C-14,42 14,42 31,30" fill="none" stroke="#c9d1d9" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="-6" y="32" width="12" height="9" rx="2" fill="#444c56" stroke="#111318" stroke-width="2"/><path d="M-24,36 C-46,40 -62,50 -56,62" fill="none" stroke="#111318" stroke-width="12" stroke-linecap="round"/><path d="M-24,36 C-46,40 -62,50 -56,62" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/><path d="M24,36 C42,42 50,50 44,62" fill="none" stroke="#111318" stroke-width="12" stroke-line